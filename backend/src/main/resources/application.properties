spring.application.name=shift28
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shift28}
spring.datasource.username=${DB_USERNAME:shift28}
spring.datasource.password=${DB_PASSWORD:shift28}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mvc.format.date=iso
server.port=${PORT:8028}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.session.timeout=10m
session.signed-in-timeout=30d
spring.session.jdbc.initialize-schema=never
spring.mvc.publish-request-handled-events=false
server.forward-headers-strategy=none
public-origin=${PUBLIC_ORIGIN:}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=20000
spring.session.jdbc.cleanup-cron=0 0 4 * * *
mail.enabled=${MAIL_ENABLED:false}
mail.host=${MAIL_HOST:}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:}
mail.starttls=${MAIL_STARTTLS:true}
mail.product-name=${MAIL_PRODUCT_NAME:Yoy\u016b}
otp.secret=${OTP_SECRET:}
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.line.channel-id=${LINE_CHANNEL_ID:}
oauth.line.channel-secret=${LINE_CHANNEL_SECRET:}
oauth.line.email-scope=${LINE_EMAIL_SCOPE:false}
client-ip.header=${CLIENT_IP_HEADER:}
