services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shift28
      POSTGRES_USER: ${DB_USERNAME:-shift28}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shift28}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/shift28
      DB_USERNAME: ${DB_USERNAME:-shift28}
      DB_PASSWORD: ${DB_PASSWORD:-shift28}
      MAIL_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_STARTTLS: "false"
      MAIL_FROM: noreply@yoyu.localhost
      OTP_SECRET: local-development-only-otp-secret-never-use-in-production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_EMAIL_SCOPE: ${LINE_EMAIL_SCOPE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8028}:8028"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8028 && printf \"GET /api/health HTTP/1.0\r\n\r\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20

volumes:
  db-data:
